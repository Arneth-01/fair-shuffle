<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e0e10">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<title>Fair Shuffle</title>
<link rel="manifest" href="manifest.json">

<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root{--bg:#0e0e10;--card:#1a1a1f;--card2:#24242b;--text:#f2f2f2;--muted:#9a9aa5;--accent:#1ed760;--err:#ff5a5a}

  body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
       padding:env(safe-area-inset-top) 16px calc(env(safe-area-inset-bottom) + 24px)}
  header,#app,#ver{max-width:560px;margin-left:auto;margin-right:auto}
  header{display:flex;align-items:center;justify-content:space-between;padding:18px 0 10px}
  h1{font-size:22px;margin:0}
  h2{font-size:18px;margin:18px 0 8px}
  h3{font-size:16px;margin:0 0 6px}
  p{color:var(--muted);line-height:1.45;margin:6px 0}
  .card{background:var(--card);border-radius:14px;padding:14px;margin:10px 0}
  .pl{display:flex;align-items:center;gap:12px;cursor:pointer;border:2px solid transparent}
  .pl:hover{background:var(--card2)}
  .pl.sel{border-color:var(--accent);background:#14251b}
  .pl img,.pl .ph{width:52px;height:52px;border-radius:8px;object-fit:cover;background:var(--card2);flex:none;display:flex;align-items:center;justify-content:center;font-size:22px}
  .pl .t{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .pl .s{color:var(--muted);font-size:13px}
  .pl .chk{width:24px;height:24px;border-radius:6px;border:2px solid var(--muted);flex:none;display:flex;align-items:center;justify-content:center;font-weight:900;color:#000}
  .pl.sel .chk{background:var(--accent);border-color:var(--accent)}
  .grow{flex:1;min-width:0}
  button,.btn{display:block;width:100%;border:0;border-radius:999px;padding:14px 18px;font-size:16px;font-weight:700;
         background:var(--accent);color:#000;margin:10px 0;text-align:center;text-decoration:none;cursor:pointer}
  button.sec,.btn.sec{background:var(--card2);color:var(--text)}
  button.small{display:inline-block;width:auto;padding:8px 14px;font-size:14px;margin:0}

  label.opt{display:flex;gap:10px;align-items:flex-start;padding:10px 0;color:var(--text);cursor:pointer}
  label.opt input{width:20px;height:20px;margin-top:2px;accent-color:var(--accent);flex:none}
  label.opt small{display:block;color:var(--muted)}
  .alist{max-height:360px;overflow:auto;margin-top:8px}
  .alist label.opt{padding:6px 0}
  code{background:var(--card2);padding:2px 6px;border-radius:6px;word-break:break-all;font-size:13px}
  .msg{padding:12px;border-radius:10px;margin:10px 0;background:var(--card2)}
  .msg.err{background:#3a1717;color:#ffd0d0}

  .bar{height:8px;border-radius:99px;background:var(--card2);overflow:hidden;margin:8px 0}
  .bar > div{height:100%;background:var(--accent)}

  ol.prev li span{color:var(--muted)}
  .sticky{position:sticky;bottom:calc(env(safe-area-inset-bottom) + 10px);z-index:5;box-shadow:0 6px 24px #000a}
  .hidden{display:none !important}
  .spin{display:inline-block;width:16px;height:16px;border:2px solid var(--muted);border-top-color:var(--accent);border-radius:50%;animation:r 0.8s linear infinite;vertical-align:middle;margin-right:8px}
  @keyframes r{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<header>
  <h1>🔀 Fair Shuffle</h1>
  <button class="small sec hidden" id="btnSettings">⚙︎</button>
</header>
<div id="app"></div>
<p id="ver" style="text-align:center;font-size:12px;margin-top:30px">Fair Shuffle · Version 13</p>

<script>
"use strict";
/* ================== Einstellungen & Speicher ================== */
const SCOPES = [
  "playlist-read-private","playlist-read-collaborative",
  "playlist-modify-private","playlist-modify-public",
  "user-library-read","user-read-playback-state","user-modify-playback-state",
  "user-read-recently-played"
].join(" ");
const SCOPE_VER = 2;            // erhöhen, wenn neue Berechtigungen dazukommen -> einmal neu einloggen
const REDIRECT_URI = location.origin + location.pathname;
const API = "https://api.spotify.com/v1";

const store = {
  get(k, d=null){ try{ const v = localStorage.getItem("fs_"+k); return v===null ? d : JSON.parse(v); }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem("fs_"+k, JSON.stringify(v)); }catch(e){} },
  del(k){ try{ localStorage.removeItem("fs_"+k); }catch(e){} }
};

const app = document.getElementById("app");
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let me = null;
let playlistCache = null;           // Liste der eigenen Playlists (für diese Sitzung)
const trackCache = new Map();       // geladene Songs pro Quelle (für diese Sitzung)

const defaultOpts = () => ({ spread: false, dedupe: true, excl: [] });
const getOpts = id => Object.assign(defaultOpts(), store.get("opts_" + id, {}));
const setOpts = (id, o) => store.set("opts_" + id, o);

/* ================== Zufall (kryptografisch, ohne Verzerrung) ================== */
function randInt(n){ // 0 .. n-1
  const limit = Math.floor(0x100000000 / n) * n;
  const buf = new Uint32Array(1);
  do { crypto.getRandomValues(buf); } while (buf[0] >= limit);
  return buf[0] % n;
}
function rand01(){ const b = new Uint32Array(1); crypto.getRandomValues(b); return b[0] / 0x100000000; }
function fisherYates(arr){
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = randInt(i + 1);
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
const artistOf = t => (t.artists && t.artists[0] && t.artists[0].name) || (t.show && t.show.name) || "";
// alle beteiligten Künstler (Hauptkünstler + Gastkünstler)
const allArtists = t => t.artists && t.artists.length ? t.artists.map(a => a.name).filter(Boolean) : (t.show && t.show.name ? [t.show.name] : []);

/* Ausgewogener Shuffle:
   Die Songs jedes Künstlers werden gleichmäßig über die ganze Playlist verteilt
   (zufälliger Startpunkt + gleicher Abstand + etwas Zufallsschwankung).
   Jeder Song kommt genau einmal und hat auf jeder Position dieselbe Chance –
   aber Häufchen vom selben Künstler werden vermieden. */
function balancedShuffle(tracks){
  const groups = new Map();
  for (const t of tracks) {
    const k = artistOf(t) || ("__" + t.id);
    if (!groups.has(k)) groups.set(k, []);
    groups.get(k).push(t);
  }
  const placed = [];
  for (const list of groups.values()) {
    const g = fisherYates(list);
    const n = g.length, gap = 1 / n;
    const start = rand01() * gap;
    g.forEach((t, i) => {
      const jitter = (rand01() - 0.5) * gap * 0.4;   // ±20 % des Abstands
      placed.push({ t, pos: (start + i * gap + jitter + 1) % 1 });
    });
  }
  placed.sort((a, b) => a.pos - b.pos);
  return placed.map(p => p.t);
}

// Optional: zwei Songs vom selben Künstler nie direkt hintereinander (soweit möglich)
function spreadArtists(a){
  const same = (x, y) => x && y && artistOf(x) && artistOf(x) === artistOf(y);
  const okAt = (pos, t, skip) =>
    !(pos > 0 && pos - 1 !== skip && same(a[pos - 1], t)) && !(pos < a.length - 1 && pos + 1 !== skip && same(a[pos + 1], t));
  for (let pass = 0; pass < 3; pass++) {
    let fixed = true;
    for (let i = 1; i < a.length; i++) {
      if (!same(a[i], a[i - 1])) continue;
      fixed = false;
      const order = [];
      for (let j = i + 1; j < a.length; j++) order.push(j);
      for (let j = 0; j < i - 1; j++) order.push(j);
      for (const j of order) {
        if (okAt(i, a[j], j) && okAt(j, a[i], i)) { [a[i], a[j]] = [a[j], a[i]]; break; }
      }
    }
    if (fixed) break;
  }
  return a;
}
const fairShuffle = (tracks, spread) => spread ? spreadArtists(balancedShuffle(tracks)) : balancedShuffle(tracks);

/* ================== Doppelte Songs ================== */
// Gleicher Song = gleicher Künstler + gleicher Titel, wobei Remaster-/Versions-Zusätze ignoriert werden.
// "Live", "Acoustic" usw. bleiben eigene Songs.
function songKey(t){
  let n = (t.name || "").toLowerCase();
  const extra = "(\\d{4}\\s*)?(digital(ly)?\\s*)?(remaster(ed)?|single version|album version|radio edit|mono|stereo)(\\s*\\d{4})?(\\s*version)?(\\s*mix)?";
  n = n.replace(new RegExp("\\s*[\\(\\[]\\s*" + extra + "\\s*[\\)\\]]", "g"), "");
  n = n.replace(new RegExp("\\s+-\\s+" + extra + "\\s*$"), "");
  n = n.normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^a-z0-9]+/g, " ").trim();
  return artistOf(t).toLowerCase() + "|" + n;
}
function removeDuplicates(list, fuzzy){
  const seen = new Set(), out = [];
  for (const t of list) {
    const k = fuzzy ? songKey(t) : t.id;
    if (seen.has(k)) continue;
    seen.add(k); if (fuzzy) seen.add(t.id);
    out.push(t);
  }
  return out;
}

/* ================== Login (PKCE, kein Server nötig) ================== */
function randomString(len){
  const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789";
  let s = ""; for (let i = 0; i < len; i++) s += chars[randInt(chars.length)];
  return s;
}
async function sha256b64url(str){
  const hash = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(str));
  return btoa(String.fromCharCode(...new Uint8Array(hash))).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
}
async function login(){
  const verifier = randomString(64);
  const state = randomString(16);
  store.set("verifier", verifier); store.set("state", state);
  const params = new URLSearchParams({
    response_type: "code", client_id: store.get("clientId"), scope: SCOPES,
    code_challenge_method: "S256", code_challenge: await sha256b64url(verifier),
    redirect_uri: REDIRECT_URI, state
  });
  location.href = "https://accounts.spotify.com/authorize?" + params;
}
async function tokenRequest(body){
  const r = await fetch("https://accounts.spotify.com/api/token", {
    method: "POST", headers: {"Content-Type": "application/x-www-form-urlencoded"},
    body: new URLSearchParams(body)
  });
  const j = await r.json();
  if (!r.ok) throw new Error("Login fehlgeschlagen: " + (j.error_description || j.error || r.status));
  store.set("token", {
    access: j.access_token,
    refresh: j.refresh_token || (store.get("token") || {}).refresh,
    exp: Date.now() + (j.expires_in - 60) * 1000
  });
}
async function handleRedirect(){
  const q = new URLSearchParams(location.search);
  if (!q.has("code") && !q.has("error")) return;
  history.replaceState(null, "", REDIRECT_URI);
  if (q.get("error")) throw new Error("Spotify hat den Login abgelehnt: " + q.get("error"));
  if (q.get("state") !== store.get("state")) throw new Error("Login-Status passt nicht. Bitte nochmal einloggen.");
  await tokenRequest({
    grant_type: "authorization_code", code: q.get("code"), redirect_uri: REDIRECT_URI,
    client_id: store.get("clientId"), code_verifier: store.get("verifier")
  });
  store.set("scopeVer", SCOPE_VER);
  store.del("verifier"); store.del("state");
}
async function accessToken(){
  const t = store.get("token");
  if (!t) return null;
  if (Date.now() < t.exp) return t.access;
  await tokenRequest({ grant_type: "refresh_token", refresh_token: t.refresh, client_id: store.get("clientId") });
  return store.get("token").access;
}
function logout(){ store.del("token"); me = null; playlistCache = null; trackCache.clear(); render(); }

/* ================== Spotify-API ================== */
async function api(path, opts = {}, retry = true){
  const token = await accessToken();
  const url = path.startsWith("http") ? path : API + path;
  const r = await fetch(url, {
    ...opts,
    headers: { "Authorization": "Bearer " + token, "Content-Type": "application/json", ...(opts.headers || {}) }
  });
  if (r.status === 401 && retry) {
    const t = store.get("token"); if (t) { t.exp = 0; store.set("token", t); }
    return api(path, opts, false);
  }
  if (r.status === 429) {
    const wait = (parseInt(r.headers.get("Retry-After") || "2", 10) + 1) * 1000;
    await new Promise(res => setTimeout(res, wait));
    return api(path, opts, retry);
  }
  const text = await r.text();
  let data = null; try { data = text ? JSON.parse(text) : null; } catch(e) {}
  if (!r.ok) {
    const err = new Error((data && data.error && data.error.message) || ("Fehler " + r.status));
    err.status = r.status; err.reason = data && data.error && data.error.reason;
    throw err;
  }
  return data;
}
async function getAll(path, onProgress){
  const out = []; let next = path;
  while (next) {
    const page = await api(next);
    out.push(...(page.items || []));
    if (onProgress) onProgress(out.length, page.total);
    next = page.next;
  }
  return out;
}
async function ensureMe(){ if (!me) me = await api("/me"); return me; }
async function getPlaylists(force){
  if (!playlistCache || force) playlistCache = await getAll("/me/playlists?limit=50");
  return playlistCache;
}
// Lädt eine Playlist und zählt mit, was nicht abspielbar ist
async function loadOne(id, onProgress, stats){
  const raw = id === "liked"
    ? await getAll("/me/tracks?limit=50", onProgress)
    : await getAll("/playlists/" + id + "/items?limit=50", onProgress);
  const out = [];
  for (const it of raw) {
    const t = it && (it.item || it.track);
    if (stats) stats.entries++;
    if (!t || !t.uri) { if (stats) stats.unavailable++; continue; }
    if (t.is_local || it.is_local || t.uri.startsWith("spotify:local")) { if (stats) stats.local++; continue; }
    if (!t.id) { if (stats) stats.unavailable++; continue; }
    out.push(t);
  }
  return out;
}
const statsCache = new Map();   // Quelle -> { entries, local, unavailable, exactDupes, songs }
// Quelle = "liked", eine Playlist-ID oder "multi:ID1,ID2,..."
async function getTracks(sourceId, onProgress){
  if (trackCache.has(sourceId)) return trackCache.get(sourceId);
  const ids = sourceId.startsWith("multi:") ? sourceId.slice(6).split(",") : [sourceId];
  let all = [], done = 0;
  const stats = { entries: 0, local: 0, unavailable: 0, exactDupes: 0, songs: 0 };
  for (const id of ids) {
    const part = await loadOne(id, (n, total) => onProgress && onProgress(done + n, null), stats);
    done += part.length; all = all.concat(part);
  }
  const before = all.length;
  all = removeDuplicates(all, false);           // exakt gleiche Songs immer nur einmal
  stats.exactDupes = before - all.length;
  stats.songs = all.length;
  statsCache.set(sourceId, stats);
  trackCache.set(sourceId, all);
  return all;
}
const shuffleName = name => "🔀 " + (name.length > 80 ? name.slice(0, 77) + "…" : name) + " (Fair Shuffle)";

async function saveShuffled(sourceId, sourceName, tracks){
  await ensureMe();
  const map = store.get("targets", {});
  let targetId = map[sourceId];
  const uris = tracks.map(t => t.uri);
  const name = shuffleName(sourceName);

  if (!targetId) {   // auf einem anderen Gerät angelegte Shuffle-Playlist am Namen wiederfinden
    try {
      const found = (await getPlaylists(true)).find(p => p && p.name === name && p.owner && p.owner.id === me.id);
      if (found) targetId = found.id;
    } catch(e) {}
  }
  if (targetId) {
    try { await api("/playlists/" + targetId + "/items", { method: "PUT", body: JSON.stringify({ uris: uris.slice(0, 100) }) }); }
    catch(e) { targetId = null; }
  }
  if (!targetId) {
    const pl = await api("/me/playlists", { method: "POST", body: JSON.stringify({
      name, public: false, description: "Fair gemischt – in Spotify mit Shuffle AUS abspielen."
    })});
    targetId = pl.id;
    await api("/playlists/" + targetId + "/items", { method: "PUT", body: JSON.stringify({ uris: uris.slice(0, 100) }) });
    playlistCache = null;
  }
  map[sourceId] = targetId; store.set("targets", map);
  for (let i = 100; i < uris.length; i += 100) {
    await api("/playlists/" + targetId + "/items", { method: "POST", body: JSON.stringify({ uris: uris.slice(i, i + 100) }) });
  }
  return targetId;
}

/* Mischen + speichern mit den gespeicherten Optionen der Quelle */
async function runMix(sourceId, sourceName, status){
  const o = getOpts(sourceId);
  status("Lade Songs …");
  let tracks = await getTracks(sourceId, n => status("Lade Songs … " + n));
  const before = tracks.length;
  if (o.dedupe) tracks = removeDuplicates(tracks, true);
  const dupes = before - tracks.length;
  const excl = new Set(o.excl);
  const beforeExcl = tracks.length;
  tracks = tracks.filter(t => !allArtists(t).some(a => excl.has(a)));
  const excluded = beforeExcl - tracks.length;
  if (!tracks.length) throw new Error("Keine Songs übrig – sind alle Künstler ausgeschlossen?");
  const shuffled = fairShuffle(tracks, o.spread);
  status(`Speichere ${shuffled.length} Songs in Spotify …`);
  const targetId = await saveShuffled(sourceId, sourceName, shuffled);
  store.set("order_" + targetId, shuffled.map(t => t.uri));
  store.del("pos_" + targetId);
  store.set("mixedAt_" + targetId, Date.now());   // alles, was davor gehört wurde, gehört zur alten Runde
  const recent = getRecent().filter(r => r.id !== sourceId);
  recent.unshift({ id: sourceId, name: sourceName });
  store.set("recent", recent.slice(0, 3));
  return { targetId, shuffled, dupes, excluded, stats: statsCache.get(sourceId) };
}

// Die letzten 3 gemischten Playlists (neueste zuerst)
function getRecent(){
  let r = store.get("recent");
  if (!r) { const last = store.get("last"); r = last ? [last] : []; }   // Übernahme aus älterer Version
  return r;
}

/* ================== Abspielen & Fortschritt ================== */
async function playerState(){
  try { return await api("/me/player"); } catch(e) { return null; }
}
async function getOrder(targetId){
  let order = store.get("order_" + targetId);
  if (!order) {
    order = (await loadOne(targetId)).map(t => t.uri);
    store.set("order_" + targetId, order);
  }
  return order;
}
// Wo steht man in der Runde? -> { index (0-basiert), total, playing }
async function getProgress(targetId){
  const order = await getOrder(targetId);
  const ctx = "spotify:playlist:" + targetId;
  const st = await playerState();
  const info = t => t ? { name: t.name || "", artist: artistOf(t) } : null;
  if (st && st.context && st.context.uri === ctx && st.item) {
    const idx = order.indexOf(st.item.uri);
    if (idx >= 0) {
      const song = info(st.item);
      store.set("pos_" + targetId, { uri: st.item.uri, ms: st.progress_ms || 0, song });
      return { index: idx, total: order.length, playing: !!st.is_playing, state: st, song };
    }
  }
  try {
    const rp = await api("/me/player/recently-played?limit=50");
    const mixedAt = store.get("mixedAt_" + targetId, 0);
    const hit = (rp.items || []).find(i => i.context && i.context.uri === ctx && i.track &&
                                            (!mixedAt || Date.parse(i.played_at) > mixedAt));
    if (hit) {
      const idx = order.indexOf(hit.track.uri);
      if (idx >= 0) {
        const saved = store.get("pos_" + targetId);
        const savedIdx = saved ? order.indexOf(saved.uri) : -1;
        if (savedIdx < idx + 1) {   // zuletzt fertig gehörter Song -> beim nächsten weitermachen
          const nextUri = order[Math.min(idx + 1, order.length - 1)];
          store.set("pos_" + targetId, { uri: nextUri, ms: 0, finished: idx + 1 >= order.length, song: info(hit.track) });
        }
      }
    }
  } catch(e) {}
  const saved = store.get("pos_" + targetId);
  if (saved) {
    const idx = order.indexOf(saved.uri);
    if (idx >= 0) return { index: idx, total: order.length, playing: false, finished: !!saved.finished, state: st, song: saved.song };
  }
  return { index: -1, total: order.length, playing: false, state: st };
}
async function playFrom(targetId, uri, ms){
  const body = { context_uri: "spotify:playlist:" + targetId };
  if (uri) body.offset = { uri };
  if (ms) body.position_ms = ms;
  await api("/me/player/play", { method: "PUT", body: JSON.stringify(body) });
  try { await api("/me/player/shuffle?state=false", { method: "PUT" }); } catch(e) {}
  try { await api("/me/player/repeat?state=off", { method: "PUT" }); } catch(e) {}
}
async function resume(targetId){
  const st = await playerState();
  if (st && st.context && st.context.uri === "spotify:playlist:" + targetId && st.item) {
    if (!st.is_playing) await api("/me/player/play", { method: "PUT" });
    try { await api("/me/player/shuffle?state=false", { method: "PUT" }); } catch(e) {}
    return;
  }
  const saved = store.get("pos_" + targetId);
  await playFrom(targetId, saved && saved.uri, saved && saved.ms);
}
function playError(e){
  return e.status === 404 ? "Kein aktives Gerät gefunden – öffne kurz die Spotify-App, starte irgendeinen Song und versuch es nochmal."
       : e.status === 403 ? "Spotify erlaubt das direkte Abspielen hier nicht (Premium nötig). Nutze „In Spotify öffnen“."
       : (e.message || String(e));
}

/* ================== Oberfläche ================== */
function msg(text, type = ""){ return `<div class="msg ${type}">${text}</div>`; }
function loading(text){ app.innerHTML = msg(`<span class="spin"></span>${esc(text)}`); }
const spinMsg = t => msg(`<span class="spin"></span>${esc(t)}`);

function topArtists(list){
  const c = new Map();
  list.forEach(t => { const a = artistOf(t) || "?"; c.set(a, (c.get(a) || 0) + 1); });
  const top = [...c.entries()].sort((a, b) => b[1] - a[1]).slice(0, 3);
  return "Meiste Songs: " + top.map(([a, n]) => `${esc(a)} ${n}× (${Math.round(n / list.length * 100)} %)`).join(", ");
}
function statsText(st){
  if (!st) return "";
  const skip = [];
  if (st.local) skip.push(`${st.local} lokale Datei(en)`);
  if (st.unavailable) skip.push(`${st.unavailable} nicht mehr verfügbar`);
  if (st.exactDupes) skip.push(`${st.exactDupes} doppelt eingetragen`);
  return `Playlist: ${st.entries} Einträge → ${st.songs} abspielbare Songs` + (skip.length ? ` (übersprungen: ${skip.join(", ")})` : "");
}
function resultHtml(r){
  const extra = [];
  if (r.dupes) extra.push(`${r.dupes} doppelte Song(s) entfernt`);
  if (r.excluded) extra.push(`${r.excluded} Song(s) von ausgeschlossenen Künstlern weggelassen`);
  return msg(`✅ ${r.shuffled.length} Songs fair gemischt und gespeichert.<br>${esc(statsText(r.stats))}<br>${topArtists(r.shuffled)}` +
    (extra.length ? `<br>${extra.join(" · ")}` : "") +
    `<br>Wichtig: In Spotify <b>Shuffle AUS</b> und <b>Wiederholen AUS</b>.`, "ok");
}

function viewSetup(error = ""){
  document.getElementById("btnSettings").classList.add("hidden");
  app.innerHTML = `
    ${error ? msg(esc(error), "err") : ""}
    <div class="card">
      <h2 style="margin-top:0">Einrichtung (einmalig)</h2>
      <p>1. Auf <b>developer.spotify.com/dashboard</b> eine App anlegen (Web API anhaken).</p>
      <p>2. Als <b>Redirect URI</b> genau diese Adresse eintragen:</p>
      <p><code>${esc(REDIRECT_URI)}</code></p>
      <button class="sec" id="copyRu">Adresse kopieren</button>
      <p>3. Die <b>Client ID</b> der App hier einfügen:</p>
      <input type="text" id="cid" placeholder="Client ID" value="${esc(store.get("clientId") || "")}" autocomplete="off" autocapitalize="off" spellcheck="false">
      <button id="saveCid">Speichern & mit Spotify einloggen</button>
    </div>`;
  document.getElementById("copyRu").onclick = () => navigator.clipboard && navigator.clipboard.writeText(REDIRECT_URI);
  document.getElementById("saveCid").onclick = () => {
    const v = document.getElementById("cid").value.trim();
    if (!/^[a-f0-9]{32}$/i.test(v)) { viewSetup("Das sieht nicht nach einer Client ID aus (32 Zeichen, 0–9 und a–f)."); return; }
    store.set("clientId", v); login();
  };
}

function viewLogin(error = "", info = ""){
  document.getElementById("btnSettings").classList.remove("hidden");
  app.innerHTML = `
    ${error ? msg(esc(error), "err") : ""}
    ${info ? msg(esc(info), "ok") : ""}
    <p>Mischt deine Playlists wirklich fair: jeder Song genau einmal, jeder mit derselben Chance.</p>
    <button id="btnLogin">Mit Spotify einloggen</button>`;
  document.getElementById("btnLogin").onclick = login;
}

/* ---------- Startseite ---------- */
let multiMode = false;
const selected = new Map();   // id -> name

async function viewHome(){
  document.getElementById("btnSettings").classList.remove("hidden");
  loading("Lade deine Playlists …");
  await ensureMe();
  trackCache.clear(); statsCache.clear();      // immer aktuelle Daten, falls Playlists in Spotify geändert wurden
  const all = await getPlaylists(true);
  const targets = new Set(Object.values(store.get("targets", {})));
  const isShuffleList = p => targets.has(p.id) || /\(Fair Shuffle\)\s*$/i.test(p.name || "");
  const own = p => p.owner && p.owner.id === me.id || p.collaborative;
  const mine = all.filter(p => p && own(p) && !isShuffleList(p));
  const others = all.filter(p => p && !own(p));
  const count = p => ((p.items || p.tracks || {}).total ?? "?");
  const tmap = store.get("targets", {});
  const recent = multiMode ? [] : getRecent().map(r => ({ ...r, target: tmap[r.id] })).filter(r => r.target);

  const card = (id, name, sub, img) => `
    <div class="card pl ${selected.has(id) ? "sel" : ""}" data-id="${esc(id)}" data-name="${esc(name)}">
      ${multiMode ? `<div class="chk">${selected.has(id) ? "✓" : ""}</div>` : ""}
      ${img ? `<img src="${esc(img)}" alt="">` : `<div class="ph">${id === "liked" ? "💚" : "🎵"}</div>`}
      <div class="grow"><div class="t">${esc(name)}</div><div class="s">${esc(sub)}</div></div>
    </div>`;

  app.innerHTML = `
    ${store.get("scopeVer") !== SCOPE_VER ? `
      <div class="msg">Damit „Song x von y“ auch nach dem Schließen von Spotify stimmt, braucht die App eine zusätzliche Erlaubnis. Alles andere funktioniert auch so.
        <button class="small" id="btnRelogin" style="margin-top:8px">Einmal neu verbinden</button></div>` : ""}
    ${recent.length ? `<p style="margin:4px 0 0">Zuletzt gemischt</p>` : ""}
    ${recent.map((r, i) => `
      <div class="card" id="quick${i}">
        <h3>${esc(r.name)}</h3>
        <div class="prog">${spinMsg("Prüfe, wo du gerade bist …")}</div>
        <div class="row">
          <button class="qNew">▶ Neue Runde</button>
          <button class="sec qResume">⏯ Weiterhören</button>
        </div>
        <div class="qOut"></div>
      </div>`).join("")}
    <div class="row" style="align-items:center">
      <p style="flex:2">${multiMode ? "Tippe die Playlists an, die zusammen gemischt werden sollen:" : `Hallo ${esc(me.display_name || me.id)}! Was soll gemischt werden?`}</p>
      <button class="small sec" id="btnMulti" style="flex:none">${multiMode ? "✕ Abbrechen" : "☑ Mehrere"}</button>
    </div>
    <input type="search" id="search" placeholder="🔍 Playlist suchen …" autocomplete="off" style="margin:6px 0 4px">
    <p id="noHits" class="hidden">Keine Playlist gefunden.</p>
    ${card("liked", "Lieblingssongs", "Deine gespeicherten Songs")}
    ${mine.map(p => card(p.id, p.name, count(p) + " Titel", p.images && p.images[0] && p.images[p.images.length - 1].url)).join("")}
    ${others.length ? `<p style="margin-top:18px">${others.length} gefolgte Playlist(s) von anderen werden nicht angezeigt – Spotify erlaubt Apps wie dieser nur Zugriff auf eigene Playlists. Tipp: In Spotify die Playlist kopieren, dann taucht sie hier auf.</p>` : ""}
    ${multiMode ? `<button class="sticky" id="btnMixSel" ${selected.size < 2 ? "disabled" : ""}>Ausgewählte zusammen mischen (${selected.size})</button>` : ""}
  `;

  const rl = document.getElementById("btnRelogin");
  if (rl) rl.onclick = login;

  // Liste & Mehrfachauswahl
  app.querySelectorAll(".pl").forEach(el => el.onclick = () => {
    if (!multiMode) return viewShuffle(el.dataset.id, el.dataset.name);
    const id = el.dataset.id;
    if (selected.has(id)) selected.delete(id); else selected.set(id, el.dataset.name);
    el.classList.toggle("sel", selected.has(id));
    el.querySelector(".chk").textContent = selected.has(id) ? "✓" : "";
    const b = document.getElementById("btnMixSel");
    b.textContent = `Ausgewählte zusammen mischen (${selected.size})`;
    b.disabled = selected.size < 2;
  });
  document.getElementById("btnMulti").onclick = () => { multiMode = !multiMode; selected.clear(); viewHome().catch(showError); };
  const mixSel = document.getElementById("btnMixSel");
  if (mixSel) mixSel.onclick = () => {
    const entries = [...selected.entries()].sort((a, b) => a[0].localeCompare(b[0]));
    const id = "multi:" + entries.map(e => e[0]).join(",");
    const names = entries.map(e => e[1]);
    const name = names.length > 3 ? names.slice(0, 3).join(" + ") + ` + ${names.length - 3} weitere` : names.join(" + ");
    multiMode = false; selected.clear();
    viewShuffle(id, name);
  };

  // Suche
  const search = document.getElementById("search");
  const norm = t => t.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "");
  search.oninput = () => {
    const q = norm(search.value.trim());
    let hits = 0;
    app.querySelectorAll(".pl").forEach(el => {
      const show = !q || norm(el.dataset.name).includes(q);
      el.classList.toggle("hidden", !show);
      if (show) hits++;
    });
    document.getElementById("noHits").classList.toggle("hidden", hits > 0);
  };

  // Ein-Knopf-Start + Fortschritt für die letzten 3
  recent.forEach((r, i) => setupQuick(document.getElementById("quick" + i), r));
}

function setupQuick(box, r){
  const prog = box.querySelector(".prog"), qOut = box.querySelector(".qOut");
  const bNew = box.querySelector(".qNew"), bRes = box.querySelector(".qResume");
  const openLink = id => `<br><a href="https://open.spotify.com/playlist/${esc(id)}" target="_blank" rel="noopener" style="color:inherit">In Spotify öffnen</a>`;
  getProgress(r.target).then(p => {
    if (p.index < 0) { prog.innerHTML = `<p>${p.total} Songs · noch nicht angefangen</p>`; return; }
    const nr = p.index + 1, done = p.finished || nr >= p.total;
    prog.innerHTML = `
      <p>${p.playing ? "▶ Läuft gerade: Song" : p.state && p.state.item && p.state.context && p.state.context.uri === "spotify:playlist:" + r.target ? "⏸ Pausiert bei Song" : "Weiter bei Song"} <b style="color:var(--text)">${nr}</b> von ${p.total}</p>
      <div class="bar"><div style="width:${Math.round(nr / p.total * 100)}%"></div></div>
      ${p.song && p.song.name ? `<p>🎵 ${p.playing ? "Jetzt" : "Zuletzt gehört"}: <b style="color:var(--text)">${esc(p.song.name)}</b>${p.song.artist ? " – " + esc(p.song.artist) : ""}</p>` : ""}
      ${done ? `<p style="color:var(--accent)">Runde fertig – Zeit für eine neue Runde!</p>` : ""}`;
  }).catch(() => { prog.innerHTML = `<p>Fortschritt gerade nicht abrufbar.</p>`; });

  bNew.onclick = async () => {
    bNew.disabled = bRes.disabled = true;
    try {
      const res = await runMix(r.id, r.name, t => qOut.innerHTML = spinMsg(t));
      r.target = res.targetId;
      qOut.innerHTML = resultHtml(res);
      prog.innerHTML = `<p>Song <b style="color:var(--text)">1</b> von ${res.shuffled.length}</p><div class="bar"><div style="width:0%"></div></div>`;
      try { await playFrom(res.targetId); qOut.insertAdjacentHTML("afterbegin", msg("▶ Neue Runde läuft!", "ok")); }
      catch(e) { qOut.insertAdjacentHTML("afterbegin", msg(esc(playError(e)) + openLink(res.targetId), "err")); }
    } catch(e) { qOut.innerHTML = msg(esc(friendly(e)), "err"); }
    bNew.disabled = bRes.disabled = false;
  };
  bRes.onclick = async () => {
    try { await resume(r.target); qOut.innerHTML = msg("▶ Weiter geht's!", "ok"); }
    catch(e) { qOut.innerHTML = msg(esc(playError(e)) + openLink(r.target), "err"); }
  };
}

/* ---------- Misch-Seite einer Playlist ---------- */
function viewShuffle(id, name){
  const o = getOpts(id);
  const isMulti = id.startsWith("multi:");
  app.innerHTML = `
    <button class="sec" id="back">← Zurück</button>
    <h2>${esc(name)}</h2>
    <p>Jeder Song kommt genau einmal, gleichmäßig und zufällig verteilt.${isMulti ? " Die ausgewählten Playlists werden zu einer gemeinsamen Shuffle-Playlist zusammengefasst." : ""}</p>
    <div class="card">
      <label class="opt"><input type="checkbox" id="oSpread" ${o.spread ? "checked" : ""}>
        <span>Gleiche Künstler nie hintereinander<small>Zusätzliche Absicherung: zwei Songs vom selben Künstler kommen nie direkt nacheinander (soweit möglich).</small></span></label>
      <label class="opt"><input type="checkbox" id="oDedupe" ${o.dedupe ? "checked" : ""}>
        <span>Doppelte Songs nur einmal<small>Erkennt z. B. denselben Song vom Album und von einer Best-of oder als Remaster. Live- und Acoustic-Versionen bleiben eigene Songs.</small></span></label>
      <button class="sec" id="btnArtists">🎤 Künstler ausschließen${o.excl.length ? ` (${o.excl.length} ausgeschlossen)` : ""}</button>
      <div id="artists"></div>
    </div>
    <button id="go">Mischen & speichern</button>
    <div id="out"></div>`;

  const save = () => {
    const cur = getOpts(id);
    cur.spread = document.getElementById("oSpread").checked;
    cur.dedupe = document.getElementById("oDedupe").checked;
    setOpts(id, cur);
  };
  document.getElementById("oSpread").onchange = save;
  document.getElementById("oDedupe").onchange = save;
  document.getElementById("back").onclick = () => viewHome().catch(showError);
  document.getElementById("btnArtists").onclick = () => showArtists(id);

  document.getElementById("go").onclick = async () => {
    save();
    const out = document.getElementById("out");
    const btn = document.getElementById("go"); btn.disabled = true;
    try {
      const r = await runMix(id, name, t => out.innerHTML = spinMsg(t));
      out.innerHTML = `
        ${resultHtml(r)}
        <button id="play">▶︎ Jetzt abspielen</button>
        <a class="btn sec" href="https://open.spotify.com/playlist/${esc(r.targetId)}" target="_blank" rel="noopener">In Spotify öffnen</a>
        <div class="card"><b>Die ersten Songs:</b>
          <ol class="prev">${r.shuffled.slice(0, 15).map(t => `<li>${esc(t.name)} <span>– ${esc(artistOf(t))}</span></li>`).join("")}</ol>
        </div>`;
      document.getElementById("play").onclick = async () => {
        try { await playFrom(r.targetId); out.insertAdjacentHTML("afterbegin", msg("▶︎ Läuft!", "ok")); }
        catch(e) { out.insertAdjacentHTML("afterbegin", msg(esc(playError(e)), "err")); }
      };
    } catch(e) {
      out.innerHTML = msg(esc(friendly(e)), "err");
    }
    btn.disabled = false;
  };
}

async function showArtists(id){
  const box = document.getElementById("artists");
  const btn = document.getElementById("btnArtists");
  if (box.dataset.open) { box.innerHTML = ""; delete box.dataset.open; return; }
  box.dataset.open = "1";
  box.innerHTML = spinMsg("Lade Songs …");
  try {
    const tracks = await getTracks(id, n => box.innerHTML = spinMsg("Lade Songs … " + n));
    const counts = new Map(), guest = new Map();
    tracks.forEach(t => allArtists(t).forEach((a, i) => {
      counts.set(a, (counts.get(a) || 0) + 1);
      if (i > 0) guest.set(a, (guest.get(a) || 0) + 1);
    }));
    const artists = [...counts.entries()].sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0]));
    const excl = new Set(getOpts(id).excl);
    box.innerHTML = `
      <p>${esc(statsText(statsCache.get(id)))} · ${artists.length} Künstler</p>
      <p>Haken weg = Songs mit diesem Künstler (auch als Gast) kommen in der Shuffle-Playlist nicht vor.</p>
      <input type="search" id="aSearch" placeholder="🔍 Künstler suchen …" autocomplete="off">
      <div class="row" style="margin:8px 0"><button class="small sec" id="aAll">Alle an</button><button class="small sec" id="aNone">Alle aus</button></div>
      <div class="alist">${artists.map(([a, n]) => `
        <label class="opt" data-a="${esc(a)}"><input type="checkbox" ${excl.has(a) ? "" : "checked"}>
          <span>${esc(a)} <small>${n} Song(s)${guest.get(a) ? `, davon ${guest.get(a)} als Gast` : ""}</small></span></label>`).join("")}</div>`;
    const update = () => {
      const ex = [...box.querySelectorAll(".alist label")].filter(l => !l.querySelector("input").checked).map(l => l.dataset.a);
      const cur = getOpts(id); cur.excl = ex; setOpts(id, cur);
      btn.textContent = "🎤 Künstler ausschließen" + (ex.length ? ` (${ex.length} ausgeschlossen)` : "");
    };
    box.querySelectorAll(".alist input").forEach(i => i.onchange = update);
    const setAll = v => { box.querySelectorAll(".alist label:not(.hidden) input").forEach(i => i.checked = v); update(); };
    document.getElementById("aAll").onclick = () => setAll(true);
    document.getElementById("aNone").onclick = () => setAll(false);
    const norm = t => t.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "");
    document.getElementById("aSearch").oninput = e => {
      const q = norm(e.target.value.trim());
      box.querySelectorAll(".alist label").forEach(l => l.classList.toggle("hidden", !!q && !norm(l.dataset.a).includes(q)));
    };
  } catch(e) {
    box.innerHTML = msg(esc(friendly(e)), "err");
  }
}

/* ---------- Einstellungen ---------- */
function viewSettings(){
  app.innerHTML = `
    <button class="sec" id="back">← Zurück</button>
    <h2>Einstellungen</h2>
    <div class="card">
      <p>Client ID: <code>${esc(store.get("clientId") || "–")}</code></p>
      <p>Redirect URI: <code>${esc(REDIRECT_URI)}</code></p>
      <button class="sec" id="chg">Client ID ändern</button>
      <button class="sec" id="out">Ausloggen</button>
    </div>
    <div class="card">
      <h3>Freunde einladen</h3>
      <p>Schick diesen Link an deine Leute – sie müssen nur noch draufdrücken und sich einloggen:</p>
      <p><code id="inv">${esc(inviteLink())}</code></p>
      <div class="row">
        <button id="invShare">📤 Teilen</button>
        <button class="sec" id="invCopy">Kopieren</button>
      </div>
      <p id="invMsg"></p>
      <p><b>Wichtig:</b> Trag jede Person vorher auf <b>developer.spotify.com/dashboard</b> → deine App → Settings → <b>User Management</b> mit Name und Spotify-E-Mail ein (max. 5 Personen).</p>
    </div>`;
  document.getElementById("back").onclick = render;
  const invMsg = t => document.getElementById("invMsg").textContent = t;
  document.getElementById("invCopy").onclick = async () => {
    try { await navigator.clipboard.writeText(inviteLink()); invMsg("✅ Link kopiert!"); }
    catch(e) { invMsg("Kopieren ging nicht – markiere den Link oben und kopiere ihn von Hand."); }
  };
  document.getElementById("invShare").onclick = async () => {
    const text = "🔀 Fair Shuffle – mischt deine Spotify-Playlists richtig zufällig. Einfach Link öffnen und mit Spotify einloggen. In Spotify dann Shuffle AUS und Wiederholen AUS lassen!";
    if (navigator.share) { try { await navigator.share({ title: "Fair Shuffle", text, url: inviteLink() }); } catch(e) {} }
    else { try { await navigator.clipboard.writeText(text + "\n" + inviteLink()); invMsg("✅ Text mit Link kopiert – jetzt z. B. in WhatsApp einfügen."); } catch(e) { invMsg("Teilen geht hier nicht – nutze „Kopieren“."); } }
  };
  document.getElementById("chg").onclick = () => { store.del("token"); viewSetup(); };
  document.getElementById("out").onclick = logout;
}

function friendly(e){
  if (e.status === 403) return "Spotify verweigert den Zugriff (403). Prüfe: Bist du im Spotify-Dashboard bei „User Management“ eingetragen? Details: " + e.message;
  return e.message || String(e);
}
function showError(e){
  if (e && e.status === 401) { logout(); return; }
  if (!store.get("token")) { viewLogin(friendly(e)); return; }
  app.innerHTML = msg(esc(friendly(e)), "err") + `<button class="sec" id="retry">Nochmal versuchen</button><button class="sec" id="lo">Ausloggen</button>`;
  document.getElementById("retry").onclick = render;
  document.getElementById("lo").onclick = logout;
}

function render(){
  if (!store.get("clientId")) return viewSetup();
  if (!store.get("token")) return viewLogin();
  viewHome().catch(showError);
}

document.getElementById("btnSettings").onclick = viewSettings;
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("sw.js", { updateViaCache: "none" }).then(r => r.update()).catch(() => {});
}

// Einladungslink: ...?cid=CLIENT_ID  -> Client ID automatisch übernehmen
function handleInvite(){
  const q = new URLSearchParams(location.search);
  const cid = (q.get("cid") || "").trim();
  if (!cid) return false;
  history.replaceState(null, "", REDIRECT_URI);
  if (!/^[a-f0-9]{32}$/i.test(cid)) return false;
  if (store.get("clientId") !== cid) { store.set("clientId", cid); store.del("token"); }
  return !store.get("token");
}
const inviteLink = () => REDIRECT_URI + "?cid=" + encodeURIComponent(store.get("clientId") || "");

(async () => {
  if (handleInvite()) {
    return viewLogin("", "Du wurdest zu Fair Shuffle eingeladen! 🎉 Tippe auf „Mit Spotify einloggen“. (Falls eine Fehlermeldung kommt: Die Person, die dich eingeladen hat, muss dich zuerst bei Spotify freischalten.)");
  }
  try { await handleRedirect(); }
  catch(e) { store.del("token"); viewLogin(e.message); return; }
  render();
})();
</script>
